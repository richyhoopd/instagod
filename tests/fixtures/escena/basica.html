<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Poppins-Bold';src:url('{{ fonts_dir }}/Poppins-Bold.ttf');font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; }
  .card { width:1080px; height:1350px; background:#FBFAF7;
          position:relative; overflow:hidden; }
  .capa { position:absolute; }
</style>
</head>
<body>
  <div class="card">
    <div id="capa-c_caja" class="capa" style="position:absolute;left:0px;top:1200px;width:1080px;height:150px;z-index:2;opacity:0.9;background:{{ color_marca }}"></div>
    <div id="capa-c_foto" class="capa" style="position:absolute;left:540px;top:600px;width:480px;height:600px;z-index:5;transform:rotate(-6deg);background-image:url('{{ imagen or (assets_dir ~ '/abc123.png') }}');background-size:cover;background-position:center;background-repeat:no-repeat;border-radius:48px;overflow:hidden;filter:drop-shadow(0 24px 48px rgba(61,53,128,.35))"></div>
    <div id="capa-c_titular" class="capa" style="position:absolute;left:72px;top:196px;width:936px;height:320px;z-index:10;display:flex;justify-content:flex-start;align-items:flex-start;overflow:hidden"><div style="font-family:'Poppins-Bold',sans-serif;font-size:96px;font-weight:800;color:#1C1A23;line-height:1.02;text-align:left;width:100%;letter-spacing:-0.03em;white-space:pre-line;text-wrap:balance">Lo que le regalas
<span style="color:#F5C842">+ lo que la cuida.</span></div></div>
    <div id="capa-c_logo" class="capa" style="position:absolute;left:900px;top:40px;width:120px;height:120px;z-index:20;background-image:url('{{ assets_dir }}/logo.svg');background-size:contain;background-position:center;background-repeat:no-repeat"></div>
  </div>
</body>
</html>
