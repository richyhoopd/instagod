name: ci

# Calidad del código: lint (ruff) + tests con cobertura (umbral en pyproject).
# Corre en cada push y PR. No necesita secrets: la suite es unitaria (DB en
# tmp, IO mockeado, sin red).
on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Tests + cobertura (umbral en pyproject.toml)
        run: pytest --cov=src --cov-report=term-missing
