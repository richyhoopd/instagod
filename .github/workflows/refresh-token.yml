name: refresh-token

# Fallback MANUAL del refresh del token de Instagram (60 días).
#
# El mecanismo real es LOCAL: el LaunchAgent com.gdlscene.refresh-token corre
# `python -m src.ig_token --aplicar` cada semana (ver
# scripts/instalar_refresh_token.sh) y actualiza .env + el secret del repo.
# Este workflow queda solo por si la Mac está muerta: refresca e imprime el
# token enmascarado; sin secrets.GH_PAT no puede persistirlo (el GITHUB_TOKEN
# de Actions no escribe secrets), así que habría que copiarlo a mano.
#
# HISTORIA: la versión anterior tenía `if: ${{ secrets.GH_PAT != '' }}` a nivel
# de step — el contexto secrets no es válido ahí, GitHub marcaba el archivo
# entero como inválido (startup_failure en cada push) y el schedule mensual
# jamás corrió. El token venció el 1-ago-2026 y tumbó la publicación a IG.
on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_BASE: ${{ secrets.IG_GRAPH_BASE }}
      IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install requests python-dotenv

      - name: Refrescar token y capturarlo
        id: refresh
        run: |
          NEW_TOKEN=$(python -c "from src.ig_token import refresh_long_lived_token as r; print(r()['access_token'])")
          echo "::add-mask::$NEW_TOKEN"
          echo "token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      # El contexto secrets no es válido en un `if` de step: el guard va en bash.
      - name: Actualizar el secret IG_ACCESS_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sin GH_PAT: no puedo escribir el secret. Copia el token del paso anterior a mano."
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "${{ steps.refresh.outputs.token }}"
