<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'Poppins'; src:url('{{ fonts_dir }}/Poppins-SemiBold.ttf') format('truetype'); font-weight:600; }

  :root { --green:#1b5e3f; --w:1080px; --h:1350px; --photo-h:920px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--w); height:var(--h); }

  .card { width:var(--w); height:var(--h); background:#fff; position:relative; overflow:hidden; display:flex; flex-direction:column; }

  /* El flyer se muestra COMPLETO (contain) sobre fondo oscuro: la info del
     cartel es el contenido, no se recorta como una foto de meme. */
  .photo {
    position:relative; width:100%; height:var(--photo-h); background-color:#101010;
    background-image:url('{{ foto_url }}'); background-size:contain;
    background-position:center; background-repeat:no-repeat;
  }
  .divider { position:absolute; left:0; right:0; top:var(--photo-h); height:4px; background:var(--green); transform:translateY(-2px); }

  .body { flex:1; display:flex; flex-direction:column; align-items:center; padding:0 70px 44px; min-height:0; }

  .badge {
    position:relative; z-index:5; margin-top:-30px; margin-bottom:20px;
    background:var(--green); color:#fff; font-family:'Poppins',sans-serif; font-weight:600;
    font-size:36px; letter-spacing:1.5px; padding:13px 36px; border-radius:12px; white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.18); text-transform:uppercase;
  }

  .caption-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; overflow:hidden; min-height:0; }
  /* Informativo: serif regular, no bold — el tono es de cartelera, no de titular. */
  .caption { font-family:'Tinos','Times New Roman',serif; font-weight:400; color:#0a0a0a; text-align:center; line-height:1.22; font-size:50px; }

  .footer { display:flex; align-items:center; justify-content:center; width:100%; gap:22px; margin-top:16px; }
  .footer .line { flex:1; height:4px; background:var(--green); max-width:230px; }
  .footer .handle { font-family:'Tinos','Times New Roman',serif; font-weight:700; color:var(--green); font-size:42px; white-space:nowrap; }
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="divider"></div>
    <div class="body">
      <div class="badge">{{ badge_text }}</div>
      <div class="caption-wrap"><div class="caption" id="caption">{{ caption }}</div></div>
      <div class="footer"><div class="line"></div><div class="handle">{{ handle }}</div><div class="line"></div></div>
    </div>
  </div>
  <script>
    function fitCaption() {
      const el = document.getElementById('caption');
      const wrap = el.parentElement;
      let size = parseFloat(getComputedStyle(el).fontSize);
      const minSize = 22;
      while ((el.scrollHeight > wrap.clientHeight || el.scrollWidth > wrap.clientWidth) && size > minSize) {
        size -= 1; el.style.fontSize = size + 'px';
      }
      window.__captionFitted = true;
    }
    document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(fitCaption)));
  </script>
</body>
</html>
