<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; }
  @font-face { font-family:'Poppins'; src:url('{{ fonts_dir }}/Poppins-SemiBold.ttf') format('truetype'); font-weight:600; }

  :root { --green:#1b5e3f; --paper:#faf8f3; --ink:#0a0a0a; --w:1080px; --h:1350px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--w); height:var(--h); }

  .card { width:var(--w); height:var(--h); background:var(--paper); position:relative;
          display:flex; flex-direction:column; overflow:hidden; }

  .photo { flex:none; width:100%; height:720px; background-size:cover; background-position:center;
           background-color:#222; }
  .card.con-foto .photo { border-bottom:6px solid var(--green); }
  .card.solo-texto .photo { display:none; }

  .body { flex:1; display:flex; flex-direction:column; align-items:center; padding:70px 88px 64px; min-height:0; }
  .card.con-foto .body { padding:44px 80px 56px; }

  .kicker { flex:none; font-family:'Poppins',sans-serif; font-weight:600; font-size:28px; letter-spacing:6px;
            text-transform:uppercase; color:var(--green); opacity:.85; text-align:center; }
  .kicker .rule { display:inline-block; width:56px; height:3px; background:var(--green); vertical-align:middle;
                  margin:0 16px; opacity:.6; }

  .caption-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; overflow:hidden; min-height:0; }
  .caption { font-family:'Tinos','Times New Roman',serif; font-weight:700; color:var(--ink);
             text-align:center; line-height:1.16; font-size:74px; }
  .card.con-foto .caption { font-size:60px; }

  .footer { flex:none; display:flex; align-items:center; justify-content:center; width:100%; gap:22px; min-height:60px; }
  .footer .line { flex:1; height:3px; background:var(--green); max-width:170px; opacity:.5; }
  .footer .handle { font-family:'Tinos',serif; font-weight:700; font-style:italic; color:var(--green);
                    font-size:42px; white-space:nowrap; }
</style>
</head>
<body>
  <div class="card {{ 'con-foto' if imagen else 'solo-texto' }}">
    <div class="photo"{% if imagen %} style="background-image:url('{{ imagen }}')"{% endif %}></div>
    <div class="body">
      <div class="kicker"><span class="rule"></span>{{ kicker }}<span class="rule"></span></div>
      <div class="caption-wrap"><div class="caption" id="caption">{{ texto }}</div></div>
      <div class="footer">
        {% if handle %}<div class="line"></div><div class="handle">{{ handle }}</div><div class="line"></div>{% endif %}
      </div>
    </div>
  </div>
  <script>
    function fitCaption() {
      const el = document.getElementById('caption');
      const wrap = el.parentElement;
      let size = parseFloat(getComputedStyle(el).fontSize);
      const minSize = 28;
      while ((el.scrollHeight > wrap.clientHeight || el.scrollWidth > wrap.clientWidth) && size > minSize) {
        size -= 1; el.style.fontSize = size + 'px';
      }
      window.__captionFitted = true;
    }
    document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(fitCaption)));
  </script>
</body>
</html>
