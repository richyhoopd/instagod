<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; }
  @font-face { font-family:'Poppins'; src:url('{{ fonts_dir }}/Poppins-SemiBold.ttf') format('truetype'); font-weight:600; }
  :root { --green:#1b5e3f; --paper:#faf8f3; --w:1080px; --h:1350px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--w); height:var(--h); }
  .card { width:var(--w); height:var(--h); background:var(--green); color:var(--paper);
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          text-align:center; padding:90px; position:relative; }
  .kicker { font-family:'Poppins',sans-serif; font-weight:600; font-size:30px; letter-spacing:5px;
            text-transform:uppercase; opacity:.85; margin-bottom:28px; }
  .evento { font-family:'Tinos',serif; font-weight:700; font-size:92px; line-height:1.02; }
  .datos { font-family:'Tinos',serif; font-style:italic; font-size:50px; margin-top:34px; line-height:1.3; }
  .cta { font-family:'Poppins',sans-serif; font-weight:600; font-size:40px; margin-top:56px;
         max-width:820px; line-height:1.35; }
  .cta span { background:var(--paper); color:var(--green); padding:12px 30px; border-radius:14px; }
  .pie { position:absolute; bottom:70px; left:0; right:0; font-family:'Tinos',serif;
         font-weight:700; font-size:52px; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">{{ kicker }}</div>
    <div class="evento">{{ evento }}</div>
    <div class="datos">{{ datos }}</div>
    <div class="cta">{{ cta_texto }}</div>
    <div class="pie">{{ cta_handle }}</div>
  </div>
</body>
</html>
