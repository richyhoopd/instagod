<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'Poppins'; src:url('{{ fonts_dir }}/Poppins-SemiBold.ttf') format('truetype'); font-weight:600; }
  :root { --green:#1b5e3f; --w:1080px; --h:1350px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--w); height:var(--h); }
  .card { width:var(--w); height:var(--h); background:#0f1410; position:relative;
          display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* El flyer se muestra COMPLETO (contain), centrado, sobre fondo oscuro. */
  .flyer { max-width:100%; max-height:100%; width:100%; height:100%;
           background-image:url('{{ flyer_url }}'); background-size:contain;
           background-position:center; background-repeat:no-repeat; }
  .marca { position:absolute; bottom:26px; right:34px; font-family:'Tinos',serif;
           font-weight:700; font-size:38px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .pag { position:absolute; top:26px; left:34px; font-family:'Poppins',sans-serif;
         font-weight:600; font-size:26px; color:#fff; background:rgba(27,94,63,.85);
         padding:4px 14px; border-radius:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="flyer"></div>
    {% if pagina %}<div class="pag">{{ pagina }}/{{ paginas }}</div>{% endif %}
    <div class="marca">@gdlscene</div>
  </div>
</body>
</html>
