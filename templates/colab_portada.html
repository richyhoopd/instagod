<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'Tinos'; src:url('{{ fonts_dir }}/Tinos-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; }
  @font-face { font-family:'Poppins'; src:url('{{ fonts_dir }}/Poppins-SemiBold.ttf') format('truetype'); font-weight:600; }

  :root { --green:#1b5e3f; --paper:#faf8f3; --ink:#0a0a0a; --w:1080px; --h:1350px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--w); height:var(--h); }

  .card { width:var(--w); height:var(--h); background:var(--paper); position:relative;
          display:flex; flex-direction:column; align-items:center; padding:70px 64px 60px; overflow:hidden; }

  .kicker { flex:none; font-family:'Poppins',sans-serif; font-weight:600; font-size:26px; letter-spacing:7px;
            text-transform:uppercase; color:var(--green); opacity:.8; margin-bottom:20px; }
  .titulo { flex:none; font-family:'Tinos',serif; font-weight:700; color:var(--ink); text-align:center;
            line-height:1.1; font-size:70px; max-width:920px; }

  .flyer-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%;
                margin-top:40px; min-height:0; }
  .flyer { max-width:100%; max-height:100%; object-fit:contain; border:6px solid var(--green);
           box-shadow:0 8px 28px rgba(0,0,0,.22); }
</style>
</head>
<body>
  <div class="card">
    {% if kicker %}<div class="kicker">{{ kicker }}</div>{% endif %}
    <div class="titulo" id="titulo">{{ titulo }}</div>
    <div class="flyer-wrap"><img class="flyer" src="{{ imagen }}" alt=""></div>
  </div>
  <script>
    function fit() {
      const el = document.getElementById('titulo');
      let size = parseFloat(getComputedStyle(el).fontSize);
      const min = 40;
      while (el.scrollWidth > el.clientWidth && size > min) { size -= 1; el.style.fontSize = size + 'px'; }
      window.__captionFitted = true;
    }
    document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(fit)));
  </script>
</body>
</html>
